name: Static and sync-contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: khai-sync-server/requirements.txt

      - name: Install sync server test dependency
        run: python -m pip install -r khai-sync-server/requirements.txt

      - name: Android source and security gates
        run: python khai-tracker-android/tools/check.py

      - name: Translation resource validation
        run: python khai-tracker-android/tools/i18n/validate.py

      - name: Institution sync contract tests
        run: python khai-sync-server/test_sync.py
